name: Build, test, package, deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - name: Build Docker image
        run: docker build --tag "little-list:$GITHUB_SHA" .
      - name: Save Docker image
        run: docker save --output little-list-image.tar "little-list:$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: little-list-image
          path: little-list-image.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: little_list
          POSTGRES_USER: little_list
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U little_list -d little_list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: little_list
      DATABASE_USER: little_list
      DATABASE_PASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: little-list-image
      - name: Create deployment package
        run: tar -czf little-list-deployment.tar.gz little-list-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: little-list-deployment
          path: little-list-deployment.tar.gz
          retention-days: 1

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: little-list-deployment
          path: ${{ runner.temp }}/little-list-deployment
      - name: Create deployment environment file
        run: |
          set -euo pipefail
          env_dir="$HOME/.config/little-list"
          env_file="$env_dir/.env"
          mkdir -p "$env_dir"
          chmod 700 "$env_dir"
          if [[ ! -s "$env_file" ]]; then
            postgres_password="$(openssl rand -hex 32)"
            pgadmin_password="$(openssl rand -hex 32)"
            umask 077
            printf 'POSTGRES_PASSWORD=%s\nPGADMIN_DEFAULT_EMAIL=admin@example.com\nPGADMIN_DEFAULT_PASSWORD=%s\n' \
              "$postgres_password" "$pgadmin_password" > "$env_file"
            chmod 600 "$env_file"
            echo "Generated database and pgAdmin credentials in $env_file."
          else
            echo "Using existing credentials in $env_file."
          fi
          if ! grep -q '^APP_PORT=' "$env_file"; then
            app_port=""
            for candidate in $(seq 3000 3100); do
              if [[ -z "$(docker ps --quiet --filter "publish=$candidate")" ]] &&
                ! ss -H -ltn "sport = :$candidate" | grep -q .; then
                app_port="$candidate"
                break
              fi
            done
            if [[ -z "$app_port" ]]; then
              echo "No free app port found between 3000 and 3100." >&2
              exit 1
            fi
            printf 'APP_PORT=%s\n' "$app_port" >> "$env_file"
            echo "Selected app host port $app_port and saved it in $env_file."
          else
            echo "Reusing app host port $(sed -n 's/^APP_PORT=//p' "$env_file")."
          fi
      - name: Load image and deploy
        env:
          APP_IMAGE: little-list:${{ github.sha }}
        run: |
          tar -xzf "$RUNNER_TEMP/little-list-deployment/little-list-deployment.tar.gz" -C "$RUNNER_TEMP/little-list-deployment"
          docker load --input "$RUNNER_TEMP/little-list-deployment/little-list-image.tar"
          docker compose \
            --project-directory "$GITHUB_WORKSPACE" \
            --project-name little-list \
            --env-file "$HOME/.config/little-list/.env" \
            up --detach --no-build --remove-orphans
