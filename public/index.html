<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f2">
    <title>Little List — A calmer way to get things done</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Little List home">
          <span class="brand-mark" aria-hidden="true">l.</span>
          <span>little list</span>
        </a>
        <span class="top-note">A little progress adds up.</span>
      </header>

      <section class="list-card" aria-labelledby="page-title">
        <div class="intro">
          <span class="eyebrow">YOUR SPACE TO FOCUS</span>
          <h1 id="page-title">One thing at a time.</h1>
          <p>Get it out of your head and onto your list.</p>
        </div>

        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input id="task-input" name="title" type="text" maxlength="120"
                 placeholder="What would you like to do?" autocomplete="off" required>
          <button type="submit">Add task <span aria-hidden="true">+</span></button>
        </form>

        <div class="list-heading">
          <h2>Your tasks</h2>
          <span id="task-count" class="task-count">0 tasks</span>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <ul id="task-list" class="task-list" aria-label="Your tasks"></ul>
        <p id="empty-state" class="empty-state">A fresh start. Add your first task above.</p>
      </section>

      <footer>Small steps, steady progress <span aria-hidden="true">✳</span></footer>
    </main>
  </body>
</html>
